[package]
name = "noble"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "NOBLE — retro-futurist HUD terminal workspace: real shells, projects, system sensors and AI quota in one cockpit"
license = "MIT"
readme = "README.md"
authors = ["Mert Soylu"]
repository = "https://github.com/MertSoylu/noble"
homepage = "https://github.com/MertSoylu/noble"
keywords = ["terminal", "tui", "ratatui", "workspace", "multiplexer"]
categories = ["command-line-utilities", "development-tools"]
# The crates.io package only ships what is needed to build.
exclude = [".github/", ".claude/", "docs/", "tests/", "examples/", "install.cmd", "install.sh", "CLAUDE.md", "AGENTS.md"]

[lib]
name = "noble"
path = "src/lib.rs"

[[bin]]
name = "noble"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Wayland: data-control protocol, falling back to X11 (XWayland).
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = "0.39.6"
toml = "1.1.6"
unicode-width = "0.2.2"
ureq = "3.4.2"
vt100 = "0.16.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

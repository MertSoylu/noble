[package]
name = "noble"
version = "1.11.0"
edition = "2024"
rust-version = "1.95"
description = "NOBLE — retro-futurist HUD terminal workspace: real shells, projects, system sensors and AI quota in one cockpit"
license = "MIT"
readme = "README.md"
authors = ["Mert Soylu"]
repository = "https://github.com/MertSoylu/noble"
homepage = "https://github.com/MertSoylu/noble"
keywords = ["terminal", "tui", "ratatui", "workspace", "multiplexer"]
categories = ["command-line-utilities", "development-tools"]
# The crates.io package only ships what is needed to build.
exclude = [".github/", ".claude/", "docs/", "tests/", "examples/", "install.cmd", "install.sh", "CLAUDE.md", "AGENTS.md"]

[lib]
name = "noble"
path = "src/lib.rs"

[[bin]]
name = "noble"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Wayland: data-control protocol, falling back to X11 (XWayland).
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
# itoa and vte are the dependencies of the vendored vt100 emulator (`src/vt100`); vte/std as upstream enabled it.
itoa = "1.0.18"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
# SHA-256 of `noble update` downloads; already in the tree as ureq's TLS backend (rustls), so no new crate.
ring = { version = "0.17.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = "0.39.6"
toml = "1.1.6"
unicode-width = "0.2.2"
ureq = "3.4.2"
vte = { version = "0.15.0", default-features = false, features = ["std"] }

# The OS asking NOBLE to end (`termination.rs`): signals on Unix, console control events on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
# Kills background commands' process groups (`ai::run_command`); already in the tree, so no new crate.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

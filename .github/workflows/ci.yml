# On every push and PR (Windows, Linux and macOS): formatting, clippy, tests, the MSRV build and dependency checks (cargo-deny).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    # The full suite, including real PTY (ConPTY), render and end-to-end tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    # Linux is a first-class platform: the same full suite. zsh and fish are installed
    # so the shell integration of every supported shell is exercised in a real PTY.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh and fish
        # The runner image has group-writable zsh function directories, which makes
        # compinit stop at an "insecure directories" question in every new zsh.
        run: |
          sudo apt-get update && sudo apt-get install -y zsh fish
          sudo chmod -R go-w /usr/local/share/zsh /usr/share/zsh 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: shellcheck install.sh

  macos:
    # macOS (Apple Silicon): the same full suite. zsh is the default shell and `/bin/bash` is 3.2 (the
    # shell tests run it as well); fish comes from Homebrew.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fish
        run: brew install fish
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux-musl:
    # The release builds static musl binaries (`release.yml`); make sure they still build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/debug/noble --version

  msrv:
    # The oldest Rust that `rust-version` in Cargo.toml promises (read from there, so it is kept in one
    # place). `cargo install noble` users build with whatever toolchain they have; this keeps the promise true.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  deny:
    # Dependencies: RustSec advisories, licenses (`deny.toml` allow-list), banned crates and sources.
    # `audit.yml` runs the advisory check weekly as well, so a new advisory shows up without a push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

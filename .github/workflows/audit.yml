# Weekly dependency check: a RustSec advisory published for a crate NOBLE already uses fails this
# run even when nothing was pushed (the per-push check is the `deny` job in `ci.yml`; config in `deny.toml`).
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

# Weekly dependency check: a RustSec advisory published for a crate NOBLE already uses fails this
# run even when nothing was pushed (the per-push check is the `deny` job in `ci.yml`; config in `deny.toml`).
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

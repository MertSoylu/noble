# On a `v*` tag, builds ready-to-run Windows, Linux and macOS binaries and uploads them
# to the GitHub release (so users don't need a Rust toolchain). The release is published last:
# `draft` creates it as a draft with the CHANGELOG notes, every `build` job uploads its archive and checksum
# to the draft, and `publish` makes it public (and the latest release) only when all builds succeeded. Until
# then `noble update` and the in-app update notice see no new version, so no platform is offered an archive
# that is not there yet; a failed build leaves an unpublished draft.
# The Linux binaries are static (musl): they run on any distribution, old glibc included. The Windows
# binaries link the C runtime statically (`.cargo/config.toml`): no VC++ redistributable is needed.
# The macOS binaries are ad-hoc signed by the linker (not notarized): a download from the
# browser needs `xattr -d com.apple.quarantine noble` once; curl and `noble update` do not.
# Archive names are what `noble update` looks for (`update::asset_name`); keep them stable. Each archive
# gets a `<archive>.sha256` next to it, which `noble update` verifies before unpacking.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds and smoke-tests every archive without publishing (a dry run).
  workflow_dispatch:

# Read-only by default; only the jobs that write the release ask for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tag only: the release as a draft, with this version's CHANGELOG.md section as its text.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The release text is this version's CHANGELOG.md section. GitHub's generated notes only list the
      # merged PRs and call the maintainer a "new contributor"; a missing section fails the release.
      - name: Release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section's lines, without the `[x.y.z]: <url>` link definitions at the end of the file.
          awk -v h="## [$version]" '
            index($0, "## [") == 1 { on = (index($0, h) == 1); next }
            /^\[[^]]*\]: / { next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # The compare link from `[x.y.z]: <url>`; the whole CHANGELOG.md if there is none.
          link=$(awk -v p="[$version]: " 'index($0, p) == 1 { print substr($0, length(p) + 1) }' CHANGELOG.md)
          echo "**Full changelog:** ${link:-https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md}" >> notes.md
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    # On a tag after `draft`; a manual run has no `draft` (skipped) and publishes nothing.
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      # One platform failing does not cancel the others; the release stays a draft then.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: noble-windows-x86_64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: noble-windows-aarch64.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: noble-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: noble-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: noble-macos-aarch64.tar.gz
          # Built natively on Intel so the smoke test runs the binary for real.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: noble-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/noble --version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/noble.exe, README.md, LICENSE -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        # No `._*` AppleDouble files from macOS tar.
        env:
          COPYFILE_DISABLE: 1
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release noble -C "$GITHUB_WORKSPACE" README.md LICENSE
      # `<archive>.sha256` in `sha256sum` format ("<hex>  <name>"): `noble update` refuses an archive without
      # one or with a mismatch (`update::checksum_name`). Users can check it with `sha256sum -c` (Linux) or
      # compare `Get-FileHash` (Windows), `shasum -a 256 -c` (macOS). Written by hand so the format is the
      # same on every runner.
      - name: Checksum
        shell: bash
        run: |
          archive="${{ matrix.archive }}"
          # macOS has `shasum -a 256` (same output format) where `sha256sum` is missing.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          hash=$($sum "$archive" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$archive" > "${{ matrix.archive }}.sha256"
          cat "$archive.sha256"
          $sum -c "$archive.sha256"
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" "${{ matrix.archive }}.sha256" --clobber

  # Tag only, and only when every archive is uploaded (a failed or cancelled build skips this job).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

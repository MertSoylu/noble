# On a `v*` tag, builds ready-to-run Windows and Linux binaries and uploads them
# to the GitHub release (so users don't need a Rust toolchain).
# The Linux binaries are static (musl): they run on any distribution, old glibc included.
# Archive names are what `noble update` looks for (`update::asset_name`); keep them stable.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds and smoke-tests every archive without publishing (a dry run).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: noble-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: noble-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: noble-linux-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/noble --version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/noble.exe, README.md, LICENSE -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release noble -C "$GITHUB_WORKSPACE" README.md LICENSE
      # The release text is this version's CHANGELOG.md section. GitHub's generated notes only list the
      # merged PRs and call the maintainer a "new contributor"; a missing section fails the release.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section's lines, without the `[x.y.z]: <url>` link definitions at the end of the file.
          awk -v h="## [$version]" '
            index($0, "## [") == 1 { on = (index($0, h) == 1); next }
            /^\[[^]]*\]: / { next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # The compare link from `[x.y.z]: <url>`; the whole CHANGELOG.md if there is none.
          link=$(awk -v p="[$version]: " 'index($0, p) == 1 { print substr($0, length(p) + 1) }' CHANGELOG.md)
          echo "**Full changelog:** ${link:-https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md}" >> notes.md
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive }}
          body_path: notes.md

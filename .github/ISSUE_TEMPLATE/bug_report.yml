name: Bug report
description: Something doesn't work or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check the [existing issues](https://github.com/MertSoylu/noble/issues) first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Home
        2. Press ...
        3. See ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: For layout or rendering problems, a screenshot helps a lot. Please mention the terminal size too.
  - type: input
    id: version
    attributes:
      label: NOBLE version
      description: Output of `noble --version`
      placeholder: noble 1.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and shell
      placeholder: Windows Terminal 1.22 + PowerShell 7.5
  - type: textarea
    id: log
    attributes:
      label: Log or config
      description: |
        Relevant parts of `noble.log` or `config.toml` (`noble --paths` shows where they are).
        Never paste tokens or credential files.
      render: text
